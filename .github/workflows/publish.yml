name: Publish

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

# Publishing uses npm trusted publishing (OIDC) — no NPM_TOKEN secret.
# `id-token: write` lets npm mint a short-lived credential and attach provenance.
# Configure the trusted publisher on npmjs.com:
#   package Settings -> Trusted Publisher -> repo rweda/makerchip-view-client,
#   workflow .github/workflows/publish.yml
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing requires npm >= 11.5.1 (newer than Node 20's bundled npm).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
