name: Publish

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

# Publishing uses npm trusted publishing (OIDC) — no NPM_TOKEN secret.
# `id-token: write` lets npm mint a short-lived credential and attach provenance.
# Configure the trusted publisher on npmjs.com:
#   package Settings -> Trusted Publisher -> repo rweda/makerchip-view-client,
#   workflow .github/workflows/publish.yml
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22, not 20: npm 12 requires node ^22.22.2 || ^24.15.0 || >=26.0.0.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing requires npm >= 11.5.1 (newer than the bundled npm).
      # Pinned to a major on purpose: this step used to be `npm@latest`, which
      # broke the v0.2.0 publish when npm 12 shipped and dropped Node 20
      # (EBADENGINE, before `npm publish` ever ran).
      - run: npm install -g npm@^11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
